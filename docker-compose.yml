services:
  cache:
    image: redis:4-alpine
    container_name: gridx-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: mysql:8.0-oracle
    container_name: gridx-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - "./docker/database/:/docker-entrypoint-initdb.d/"
      - "./docker/database/mysql:/var/lib/mysql"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "gridx"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  socket:
    image: socketcluster/socketcluster:v17.4.0
    platform: linux/amd64
    container_name: gridx-socket
    restart: unless-stopped
    ports:
      - "38000:8000"
    environment:
      SOCKETCLUSTER_WORKERS: 10
      SOCKETCLUSTER_BROKERS: 10
      # SOCKETCLUSTER_OPTIONS can be set via docker-compose.override.yml for specific environments
      # For production, use: SOCKETCLUSTER_OPTIONS: '{"origins":"https://yourdomain.com:*"}'
      # For development, use: SOCKETCLUSTER_OPTIONS: '{"origins":"http://localhost:*"}'

  scheduler:
    image: fleetbase/fleetbase-api:latest
    container_name: gridx-scheduler
    command: ["go-crond", "--verbose", "root:./crontab"]
    restart: unless-stopped
    volumes:
      - ./api/.env:/fleetbase/api/.env
    environment:
      DATABASE_URL: "mysql://root@database/gridx"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
    depends_on:
      - database
      - cache

  queue:
    image: fleetbase/fleetbase-api:latest
    container_name: gridx-queue
    command: ["php", "artisan", "queue:work"]
    restart: unless-stopped
    volumes:
      - ./api/.env:/fleetbase/api/.env
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      DATABASE_URL: "mysql://root@database/gridx"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
    depends_on:
      - database
      - cache

  console:
    container_name: gridx-console
    restart: unless-stopped
    build:
      context: .
      dockerfile: console/Dockerfile.local
      args:
        ENVIRONMENT: development
        EXTENSIONS: "fleetops,iam"
    ports:
      - "4200:4200"
    volumes:
      - ./console/fleetbase.config.json:/usr/share/nginx/html/fleetbase.config.json

  application:
    container_name: gridx-api
    restart: unless-stopped
    image: fleetbase/fleetbase-api:latest
    volumes:
      - ./api/.env:/fleetbase/api/.env
      - ./api/storage/app:/fleetbase/api/storage/app
      - ./api/config/fleetbase.php:/fleetbase/api/config/fleetbase.php
    environment:
      ENVIRONMENT: development
      DATABASE_URL: "mysql://root@database/gridx"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache
      REDIS_URL: tcp://cache
      SESSION_DOMAIN: localhost
      BROADCAST_DRIVER: socketcluster
      MAIL_FROM_NAME: GridX
      APP_NAME: GridX
      LOG_CHANNEL: daily
      REGISTRY_HOST: https://registry.fleetbase.io
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
      OSRM_HOST: https://router.project-osrm.org
    depends_on:
      - database
      - cache
      - queue

  traccar:
    image: traccar/traccar:6-alpine
    container_name: gridx-traccar
    restart: unless-stopped
    ports:
      - "8082:8082"    # Traccar web UI / REST API
      - "5055:5055"    # osmAnd protocol — Traccar Client app reports here
    volumes:
      - ./docker/traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - ./docker/traccar/logs:/opt/traccar/logs
      - ./docker/traccar/data:/opt/traccar/data

  httpd:
    container_name: gridx-httpd
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/httpd/Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - application
